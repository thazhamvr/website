<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thazham VR — Immersive Culture, Education & Heritage</title>
<meta name="description" content="Thazham VR is an immersive technology company preserving knowledge, transforming education and building heritage experiences through Virtual Reality.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg-deep:#0a0a0a;
  --bg-card:#151515;
  --accent:#ffffff;
  --text-light:#f0f0f0;
  --text-dim:#a0a0a0;
  --border-light:#2a2a2a;
  --transition:all .25s ease;

  --base-font-size:16px;
  --heading-scale:1;
  --heading-weight:800;
  --heading-tracking:-0.02em;
  --section-padding:80px;
  --container-padding:clamp(1rem, 4vw, 4rem);
  --card-padding:26px;
  --grid-gap:18px;
}

html{scroll-behavior:smooth}

body{
  background:var(--bg-deep);
  color:#eaeaea;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:var(--base-font-size);
  line-height:1.5;
  overflow-x:hidden;
}

.container{max-width:1280px;margin:0 auto;padding:0 var(--container-padding);position:relative;z-index:2}
section{padding:var(--section-padding) 0;position:relative}

h1,h2,h3,h4{font-weight:var(--heading-weight);letter-spacing:var(--heading-tracking)}
h1{font-size:calc(clamp(2.8rem,7vw,5.2rem) * var(--heading-scale));line-height:1.08}
h2{font-size:calc(clamp(2.2rem,5.5vw,3.6rem) * var(--heading-scale));margin-bottom:1.2rem}
h2 .accent{color:var(--accent)}

.section-head{text-align:center;max-width:760px;margin:0 auto 3rem}
.section-head p{color:var(--text-dim);font-size:1.1rem;margin-top:.5rem}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
  padding:1rem 2.3rem;border-radius:60px;font-weight:600;font-size:1.05rem;
  text-decoration:none;transition:var(--transition);border:1px solid transparent;
  cursor:pointer;font-family:inherit;
}
.btn-primary{background:var(--accent);color:#0a0a0a;box-shadow:0 0 20px rgba(255,255,255,.3)}
.btn-primary:hover{background:#ddd;color:#000;box-shadow:0 0 35px rgba(255,255,255,.6),0 0 60px rgba(255,255,255,.3);transform:scale(1.02)}
.btn-outline{border:1.5px solid var(--accent);color:var(--accent);background:transparent;box-shadow:0 0 15px rgba(255,255,255,.15)}
.btn-outline:hover{background:var(--accent);color:#0a0a0a;box-shadow:0 0 30px rgba(255,255,255,.5);transform:scale(1.02)}

.scroll-progress{
  position:fixed;top:0;left:0;height:3px;width:0;z-index:300;
  background:linear-gradient(90deg,#ffffff,#8a8a8a);
  box-shadow:0 0 14px rgba(255,255,255,.6);
  transition:width .1s linear;
}

.navbar{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,.88);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid #2a2a2a;
  padding:1rem 2rem;
}
.nav-container{display:flex;justify-content:space-between;align-items:center;max-width:1400px;margin:0 auto}
.logo{display:flex;align-items:center;gap:.75rem;font-size:1.7rem;font-weight:800;color:#fff;letter-spacing:-.02em}
.logo img{height:38px;width:auto;display:block}
.logo .logo-text{display:inline-flex;gap:.35rem}
.logo .logo-text span{color:#8f8f8f}
.nav-links{display:flex;gap:2.2rem;align-items:center}
.nav-links a{text-decoration:none;color:#ddd;font-weight:500;font-size:1rem;transition:var(--transition);cursor:pointer}
.nav-links a:hover{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.5)}
.nav-cta{background:transparent;border:2px solid #fff;color:#fff;padding:.6rem 2rem;border-radius:50px;font-weight:700;font-size:1rem;cursor:pointer;transition:var(--transition);font-family:inherit}
.nav-cta:hover{background:#fff;color:#0a0a0a;box-shadow:0 0 25px #fff}
.menu-toggle{display:none;font-size:1.8rem;color:#fff;cursor:pointer;background:none;border:none}

.hero{
  min-height:100vh;display:flex;align-items:center;
  position:relative;isolation:isolate;overflow:hidden;padding:6rem 0 4rem;
}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;z-index:0;pointer-events:none;display:none}
.hero-video.active{display:block}
.hero-scrim{
  position:absolute;inset:0;z-index:1;
  background:
    radial-gradient(circle at 75% 30%,rgba(255,255,255,.06) 0%,transparent 55%),
    linear-gradient(180deg,rgba(10,10,10,.55) 0%,rgba(10,10,10,.85) 60%,#0a0a0a 100%);
}
.hero::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.2;
  background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iNDAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjc0IiBudW1PY3RhdmVzPSIzIiAvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNmKSIgb3BhY2l0eT0iMC4wMjUiIC8+PC9zdmc+');
}
.hero-content{max-width:960px;position:relative;z-index:2}

.eyebrow{
  display:inline-flex;align-items:center;gap:.6rem;
  font-size:.8rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:#c4c4c4;border:1px solid #2f2f2f;background:rgba(255,255,255,.03);
  padding:.5rem 1.1rem;border-radius:60px;margin-bottom:1.6rem;
}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;animation:pulseDot 2s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}

.hero-sub{font-size:1.22rem;color:#b8b8b8;max-width:660px;margin:1.5rem 0 2.5rem}
.hero-btns{display:flex;gap:1.2rem;flex-wrap:wrap}

.stats-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--grid-gap);
  background:linear-gradient(180deg,#141414,#0f0f0f);
  border-radius:50px;padding:2.8rem 2rem;margin:-3rem auto 3rem;
  border:1px solid #2a2a2a;box-shadow:0 30px 40px -20px #000;
  position:relative;z-index:5;
}
.stat-item{text-align:center}
.stat-highlight{font-size:3rem;font-weight:800;color:#fff;line-height:1.2;text-shadow:0 0 30px rgba(255,255,255,.5);word-break:break-word}
.stat-label{color:#a0a0a0;font-weight:500;letter-spacing:.5px;font-size:.95rem}

.partners{padding:3rem 0 4rem}
.partners-title{
  text-align:center;color:#8a8a8a;font-size:.82rem;font-weight:600;
  letter-spacing:.22em;text-transform:uppercase;margin-bottom:2.4rem;
}
.marquee{
  position:relative;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
}
.marquee + .marquee{margin-top:1.1rem}
.marquee-track{display:flex;gap:1.2rem;width:max-content;animation:marqueeScroll 40s linear infinite}
.marquee-track.reverse{animation-direction:reverse;animation-duration:52s}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes marqueeScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.logo-chip{
  display:flex;align-items:center;gap:.85rem;
  padding:1rem 1.8rem;border-radius:18px;white-space:nowrap;
  background:#121212;border:1px solid #262626;color:#8f8f8f;
  font-weight:700;font-size:1rem;transition:var(--transition);
}
.logo-chip i{font-size:1.3rem;color:#6f6f6f;transition:var(--transition)}
.logo-chip img{height:26px;width:auto;filter:grayscale(1);opacity:.7;transition:var(--transition);display:block}
.logo-chip:hover{color:#fff;border-color:#4a4a4a;background:#181818;box-shadow:0 0 30px rgba(255,255,255,.08);transform:translateY(-3px)}
.logo-chip:hover i,.logo-chip:hover img{color:#fff;filter:grayscale(0);opacity:1}

.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--grid-gap);margin-top:1rem}
.video-card{
  background:#141414;border:1px solid #282828;border-radius:26px;
  overflow:hidden;cursor:pointer;transition:var(--transition);
  display:flex;flex-direction:column;
}
.video-card:hover{transform:translateY(-8px);border-color:#fff;box-shadow:0 30px 45px -20px rgba(255,255,255,.22)}
.video-thumb{
  position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:linear-gradient(135deg,#1e1e1e,#0e0e0e);
}
.video-thumb::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.1),transparent 62%);
}
.video-thumb .watermark{font-size:3.2rem;color:rgba(255,255,255,.1);position:relative;z-index:1}
.play-btn{
  position:absolute;z-index:2;width:64px;height:64px;border-radius:50%;
  background:rgba(255,255,255,.95);color:#0a0a0a;
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  box-shadow:0 0 32px rgba(255,255,255,.4);
  transition:var(--transition);padding-left:4px;
}
.play-btn::after{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(255,255,255,.45);animation:ring 2.4s infinite;
}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.video-card:hover .play-btn{transform:scale(1.12);box-shadow:0 0 50px rgba(255,255,255,.75)}
.duration{
  position:absolute;bottom:.85rem;right:.85rem;z-index:2;
  background:rgba(0,0,0,.72);border:1px solid #333;color:#ddd;
  font-size:.76rem;font-weight:600;padding:.25rem .65rem;border-radius:8px;letter-spacing:.04em;
}
.video-info{padding:1.3rem 1.5rem 1.6rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.video-info h3{font-size:1.2rem;color:#f2f2f2}
.video-info p{color:#9d9d9d;font-size:.93rem;line-height:1.5;flex:1}
.tag{
  align-self:flex-start;margin-top:.5rem;font-size:.72rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:#cfcfcf;
  border:1px solid #333;background:#1b1b1b;padding:.3rem .8rem;border-radius:40px;
}

.video-modal{
  position:fixed;inset:0;z-index:500;display:none;
  align-items:center;justify-content:center;padding:1.5rem;
}
.video-modal.open{display:flex}
.video-modal-backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,.88);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.video-modal-inner{
  position:relative;z-index:2;width:100%;max-width:1000px;
  background:#0e0e0e;border:1px solid #2c2c2c;border-radius:24px;
  overflow:hidden;box-shadow:0 40px 90px -20px #000;
}
.video-modal-inner video{width:100%;display:block;background:#000;aspect-ratio:16/9}
.modal-caption{padding:1.3rem 1.6rem 1.6rem}
.modal-caption h3{font-size:1.25rem;color:#fff;margin-bottom:.35rem}
.modal-caption p{color:#9d9d9d;font-size:.95rem}
.modal-close{
  position:absolute;top:.9rem;right:.9rem;z-index:3;
  width:44px;height:44px;border-radius:50%;border:1px solid #444;
  background:rgba(15,15,15,.85);color:#fff;font-size:1.05rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:var(--transition);
}
.modal-close:hover{background:#fff;color:#0a0a0a;border-color:#fff;transform:rotate(90deg)}

.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start}
.vision-card{
  background:linear-gradient(160deg,#161616,#101010);
  padding:var(--card-padding);border-radius:40px;border-left:6px solid #fff;
  box-shadow:0 20px 30px -10px rgba(0,0,0,.5);
}
.vision-card h3{color:#fff;margin-bottom:1rem;font-size:1.5rem}
.vision-card p{font-size:1.15rem;color:#c8c8c8}

.focus-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--grid-gap);margin-top:1rem}
.focus-card{
  background:#151515;border-radius:30px;overflow:hidden;
  transition:var(--transition);border:1px solid #2d2d2d;
  display:flex;flex-direction:column;width:280px;flex:0 0 auto;
}
.focus-card:hover{transform:translateY(-8px);box-shadow:0 30px 30px -10px rgba(255,255,255,.1),0 0 0 1px #fff}
.card-img{
  height:160px;background:#1f1f1f;display:flex;align-items:center;justify-content:center;
  font-size:3rem;color:#bbb;
}
.focus-card h3{padding:1.4rem 1.4rem .4rem;font-size:1.3rem;color:#f0f0f0}
.focus-card p{padding:0 1.4rem 1.6rem;color:#a0a0a0;font-size:.93rem;line-height:1.45}

.coming-soon-block{
  text-align:center;background:#121212;border-radius:60px;
  padding:4.5rem 2rem;border:2px dashed #555;
}
.coming-soon-block h3{font-size:calc(clamp(2.6rem,7vw,4.6rem) * var(--heading-scale));color:#fff;text-shadow:0 0 30px rgba(255,255,255,.4)}

.careers-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--grid-gap);margin-top:1rem}
.career-card{
  background:#151515;border-radius:30px;padding:2rem;width:320px;
  transition:var(--transition);border:1px solid #2d2d2d;text-align:center;
  display:flex;flex-direction:column;
}
.career-card:hover{transform:translateY(-8px);box-shadow:0 30px 30px -10px rgba(255,255,255,.1),0 0 0 1px #fff}
.career-card i.role{font-size:2.8rem;color:#fff;margin-bottom:1.4rem}
.career-card h3{font-size:1.5rem;margin-bottom:.7rem}
.career-card .location{font-size:.88rem;color:#888;margin-bottom:.9rem}
.career-card .description{font-size:.9rem;color:#aaa;margin-bottom:1.5rem;line-height:1.45;flex:1}
.career-card .btn-sm{
  display:inline-block;padding:.6rem 1.5rem;border-radius:40px;font-weight:600;
  text-decoration:none;background:transparent;border:1px solid #fff;
  color:#fff;transition:var(--transition);
}
.career-card .btn-sm:hover{background:#fff;color:#0a0a0a}

.contact-section{display:flex;flex-direction:column;align-items:center}
.contact-card{
  background:#141414;border-radius:48px;padding:3rem;max-width:680px;width:100%;
  border:1px solid #444;box-shadow:0 30px 40px -20px #000;
}
.contact-item{display:flex;align-items:center;gap:1.4rem;font-size:1.15rem;margin:1.8rem 0}
.contact-item i{color:#fff;width:2.2rem;font-size:1.7rem;text-align:center}
.contact-item a{color:inherit;text-decoration:none;transition:var(--transition);word-break:break-all}
.contact-item a:hover{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.5)}

.footer{background:#080808;padding:4rem 2rem 3rem;border-top:1px solid #2a2a2a}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1.5fr;gap:3rem;max-width:1280px;margin:0 auto}
.footer-logo{font-size:2rem;font-weight:800;color:#fff}
.footer-logo span{color:#8f8f8f}
.footer-links{display:flex;flex-direction:column;gap:.9rem}
.footer-links a{color:#aaa;text-decoration:none;transition:var(--transition);font-size:.98rem}
.footer-links a:hover{color:#fff}
.footer-contact p{margin:.75rem 0;color:#aaa;font-size:.98rem}
.footer-contact a{color:#aaa;text-decoration:none}
.footer-contact a:hover{color:#fff}
.footer-bottom{
  max-width:1280px;margin:3rem auto 0;padding-top:1.6rem;border-top:1px solid #1e1e1e;
  display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:#666;font-size:.88rem;
}

.cs-section{padding:var(--section-padding) 0}
.cs-inner{max-width:1280px;margin:0 auto;padding:0 var(--container-padding);position:relative;z-index:2}
.cs-eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:#b0b0b0;font-weight:600;margin-bottom:1rem}
.cs-title{font-size:calc(clamp(1.9rem,4.5vw,3rem) * var(--heading-scale));margin-bottom:1rem;color:#fff;line-height:1.1}
.cs-body{color:#b8b8b8;font-size:1.05rem;line-height:1.6}
.cs-center{text-align:center}
.cs-center .cs-body{max-width:680px;margin:0 auto}

.cs-image-boxed img,.cs-image-boxed video{width:100%;border-radius:20px;display:block}
.cs-image-full{padding:0}
.cs-image-full img,.cs-image-full video{width:100%;display:block}
.cs-caption{text-align:center;color:#8f8f8f;font-size:.88rem;margin-top:1rem}

.cs-split{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
.cs-split.cs-reverse .cs-split__media{order:2}
.cs-split.cs-reverse .cs-split__copy{order:1}
.cs-split__media img,.cs-split__media video{width:100%;border-radius:20px;display:block;background:#000}
.cs-split__bullets{list-style:none;padding:0;margin:1.5rem 0 0}
.cs-split__bullets li{position:relative;padding-left:1.8rem;margin-bottom:.75rem;color:#b8b8b8}
.cs-split__bullets li::before{
  content:'';position:absolute;left:0;top:.6rem;width:8px;height:8px;border-radius:50%;
  background:#c8f542;box-shadow:0 0 8px rgba(200,245,66,.7);
}

.cs-marquee{overflow:hidden;padding:1rem 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
}
.cs-marquee__track{display:flex;gap:3rem;width:max-content;animation:csMarquee 34s linear infinite}
.cs-marquee__track span{font-size:calc(clamp(1.5rem,3.2vw,2.4rem) * var(--heading-scale));font-weight:900;color:#2a2a2a;letter-spacing:-.02em;white-space:nowrap}
@keyframes csMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.cs-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--grid-gap)}
.cs-card{background:#141414;border:1px solid #242424;border-radius:20px;padding:var(--card-padding);transition:var(--transition)}
.cs-card:hover{border-color:#fff;transform:translateY(-4px)}
.cs-card img{width:100%;border-radius:14px;margin-bottom:1rem;display:block;aspect-ratio:16/10;object-fit:cover}
.cs-card h3{font-size:1.15rem;margin-bottom:.5rem;color:#fff}
.cs-card p{color:#9a9a9a;font-size:.93rem;line-height:1.5}

.cs-cta{
  background:linear-gradient(160deg,#161616,#0d0d0d);
  border:1px solid #262626;border-radius:32px;
  padding:calc(var(--card-padding) * 1.5) var(--card-padding);
  text-align:center;position:relative;overflow:hidden;
}
.cs-cta__bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22;z-index:0}
.cs-cta > *{position:relative;z-index:1}
.cs-cta h2{font-size:calc(clamp(1.8rem,4vw,2.6rem) * var(--heading-scale));margin-bottom:1rem;color:#fff}
.cs-cta p{color:#b8b8b8;max-width:640px;margin:0 auto 1.8rem}
.cs-cta__btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

.cs-hero{
  min-height:70vh;display:flex;align-items:center;justify-content:center;
  text-align:center;position:relative;overflow:hidden;padding:0;
}
.cs-hero__bg{position:absolute;inset:0;z-index:0}
.cs-hero__bg img,.cs-hero__bg video{width:100%;height:100%;object-fit:cover;display:block}
.cs-hero__scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,10,10,.55),rgba(10,10,10,.88))}
.cs-hero__inner{position:relative;z-index:2;max-width:820px;padding:5rem 2rem}
.cs-hero h1{font-size:calc(clamp(2rem,5vw,3.5rem) * var(--heading-scale));margin-bottom:1rem;color:#fff}
.cs-hero p{color:#c8c8c8;font-size:1.12rem;margin-bottom:2rem;max-width:640px;margin-left:auto;margin-right:auto}
.cs-hero__btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

.fade-section{opacity:0;transform:translateY(35px);transition:opacity .9s cubic-bezier(.2,.9,.3,1),transform .9s ease}
.fade-section.visible{opacity:1;transform:translateY(0)}

@media (max-width:980px){
  .nav-links{
    position:fixed;top:74px;left:0;width:100%;
    background:rgba(10,10,10,.98);backdrop-filter:blur(20px);
    flex-direction:column;padding:3rem 2rem;gap:2rem;
    border-bottom:3px solid #fff;
    transform:translateY(-160%);opacity:0;transition:.4s;z-index:99;
    box-shadow:0 40px 60px #000;
  }
  .nav-links.active{transform:translateY(0);opacity:1}
  .menu-toggle{display:block}
